<!DOCTYPE html>
<html lang="ar" dir="rtl" class="scroll-smooth">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Zad Automation | نسيت كلمة المرور</title>
    
    <!-- Google Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@300;400;500;600;700;800;900&family=Inter:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
    
    <!-- FontAwesome Icons -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
    
    <!-- Tailwind CSS CDN -->
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    colors: {
                        brand: {
                            navy: '#0a192f',
                            slate: '#1e293b',
                            dark: '#0f172a',
                            orange: '#f97316',
                            gold: '#eab308',
                            cyan: '#06b6d4',
                            accent: '#f97316',
                            card: '#1e293b',
                            border: '#334155'
                        }
                    },
                    fontFamily: {
                        cairo: ['Cairo', 'sans-serif'],
                        inter: ['Inter', 'sans-serif']
                    }
                }
            }
        }
    </script>
    
    <link rel="stylesheet" href="css/style.css">
</head>
<body class="min-h-screen flex items-center justify-center bg-slate-950 p-4">
    
    <!-- Forgot Password Container -->
    <div class="glass-card rounded-2xl p-8 border border-slate-700 max-w-md w-full">
        
        <!-- Logo/Brand -->
        <div class="text-center mb-8">
            <div class="inline-flex items-center justify-center w-16 h-16 rounded-2xl bg-slate-900 border border-slate-700 mb-4 mx-auto">
                <i class="fa-solid fa-key text-2xl text-orange-500"></i>
            </div>
            <h1 class="text-2xl font-black text-white mb-2">نسيت كلمة المرور؟</h1>
            <p class="text-sm text-slate-400">أدخل بريدك الإلكتروني وسنرسل لك رابط إعادة تعيين</p>
        </div>
        
        <!-- Forgot Password Form -->
        <form id="forgotForm" class="space-y-6">
            <!-- Email Field -->
            <div>
                <label class="block text-sm font-bold text-slate-300 mb-2">البريد الإلكتروني</label>
                <div class="relative">
                    <div class="absolute inset-y-0 right-0 pr-3 flex items-center">
                        <i class="fa-solid fa-envelope text-slate-500"></i>
                    </div>
                    <input type="email" id="email" required class="w-full bg-slate-950 border border-slate-700 rounded-xl px-4 py-3 pr-10 text-sm text-white focus:border-orange-500 focus:outline-none placeholder:text-slate-600" placeholder="example@domain.com">
                </div>
            </div>
            
            <!-- Error/Success Message -->
            <div id="messageBox" class="hidden p-3 rounded-lg text-sm"></div>
            
            <!-- Submit Button -->
            <button type="submit" class="w-full py-3.5 rounded-xl bg-gradient-to-r from-cyan-500 to-blue-600 hover:from-cyan-600 hover:to-blue-700 text-white font-bold text-sm transition-all flex items-center justify-center gap-2">
                <i class="fa-solid fa-paper-plane"></i>
                <span>إرسال رابط إعادة التعيين</span>
            </button>
        </form>
        
        <!-- Links -->
        <div class="mt-6 text-center space-y-3">
            <a href="/login.html" class="text-sm text-slate-400 hover:text-orange-400 transition-colors flex items-center justify-center gap-1">
                <i class="fa-solid fa-arrow-right text-xs"></i>
                <span>العودة إلى تسجيل الدخول</span>
            </a>
            <a href="/signup.html" class="text-sm text-slate-400 hover:text-orange-400 transition-colors">
                ليس لديك حساب؟ إنشاء حساب جديد
            </a>
        </div>
    </div>
    
    <!-- Application Script -->
    <script>
        // Forgot Password Form Handler
        document.getElementById('forgotForm').addEventListener('submit', async function(e) {
            e.preventDefault();
            
            const email = document.getElementById('email').value;
            const messageBox = document.getElementById('messageBox');
            
            try {
                const response = await fetch('/api/auth/forgot-password', {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json'
                    },
                    body: JSON.stringify({ email })
                });
                
                const data = await response.json();
                
                // Show message
                messageBox.textContent = data.message || data.error || 'تم إرسال الرابط إذا كان البريد موجوداً';
                messageBox.classList.remove('hidden');
                messageBox.className = 'p-3 rounded-lg text-sm ' + (response.ok 
                    ? 'bg-emerald-500/20 border border-emerald-500/30 text-emerald-400' 
                    : 'bg-red-500/20 border border-red-500/30 text-red-400');
            } catch (error) {
                console.error('Forgot password error:', error);
                messageBox.textContent = 'حدث خطأ في الخادم';
                messageBox.className = 'p-3 rounded-lg text-sm bg-red-500/20 border border-red-500/30 text-red-400';
                messageBox.classList.remove('hidden');
            }
        });
    </script>
</body>
</html>

<!DOCTYPE html>
<html lang="ar" dir="rtl" class="scroll-smooth">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Zad Automation | إنشاء حساب</title>
    
    <!-- Google Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@300;400;500;600;700;800;900&family=Inter:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
    
    <!-- FontAwesome Icons -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
    
    <!-- Tailwind CSS CDN -->
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    colors: {
                        brand: {
                            navy: '#0a192f',
                            slate: '#1e293b',
                            dark: '#0f172a',
                            orange: '#f97316',
                            gold: '#eab308',
                            cyan: '#06b6d4',
                            accent: '#f97316',
                            card: '#1e293b',
                            border: '#334155'
                        }
                    },
                    fontFamily: {
                        cairo: ['Cairo', 'sans-serif'],
                        inter: ['Inter', 'sans-serif']
                    }
                }
            }
        }
    </script>
    
    <link rel="stylesheet" href="css/style.css">
</head>
<body class="min-h-screen flex items-center justify-center bg-slate-950 p-4">
    
    <!-- Signup Container -->
    <div class="glass-card rounded-2xl p-8 border border-slate-700 max-w-md w-full">
        
        <!-- Logo/Brand -->
        <div class="text-center mb-8">
            <div class="inline-flex items-center justify-center w-16 h-16 rounded-2xl bg-slate-900 border border-slate-700 mb-4 mx-auto">
                <i class="fa-solid fa-user-plus text-2xl text-orange-500"></i>
            </div>
            <h1 class="text-2xl font-black text-white mb-2">إنشاء حساب جديد</h1>
            <p class="text-sm text-slate-400">انضم إلى Zad Automation</p>
        </div>
        
        <!-- Signup Form -->
        <form id="signupForm" class="space-y-6">
            <!-- Username Field -->
            <div>
                <label class="block text-sm font-bold text-slate-300 mb-2">اسم المستخدم</label>
                <div class="relative">
                    <div class="absolute inset-y-0 right-0 pr-3 flex items-center">
                        <i class="fa-solid fa-user text-slate-500"></i>
                    </div>
                    <input type="text" id="username" required minlength="3" class="w-full bg-slate-950 border border-slate-700 rounded-xl px-4 py-3 pr-10 text-sm text-white focus:border-orange-500 focus:outline-none placeholder:text-slate-600" placeholder="اختر اسم مستخدم...">
                </div>
            </div>
            
            <!-- Email Field -->
            <div>
                <label class="block text-sm font-bold text-slate-300 mb-2">البريد الإلكتروني</label>
                <div class="relative">
                    <div class="absolute inset-y-0 right-0 pr-3 flex items-center">
                        <i class="fa-solid fa-envelope text-slate-500"></i>
                    </div>
                    <input type="email" id="email" required class="w-full bg-slate-950 border border-slate-700 rounded-xl px-4 py-3 pr-10 text-sm text-white focus:border-orange-500 focus:outline-none placeholder:text-slate-600" placeholder="example@domain.com">
                </div>
            </div>
            
            <!-- Phone Field -->
            <div>
                <label class="block text-sm font-bold text-slate-300 mb-2">رقم الهاتف / الواتساب</label>
                <div class="relative">
                    <div class="absolute inset-y-0 right-0 pr-3 flex items-center">
                        <i class="fa-solid fa-phone text-slate-500"></i>
                    </div>
                    <input type="tel" id="phone" class="w-full bg-slate-950 border border-slate-700 rounded-xl px-4 py-3 pr-10 text-sm text-white focus:border-orange-500 focus:outline-none placeholder:text-slate-600" placeholder="+20xxxxxxxxxx">
                </div>
            </div>
            
            <!-- Password Field -->
            <div>
                <label class="block text-sm font-bold text-slate-300 mb-2">كلمة المرور</label>
                <div class="relative">
                    <div class="absolute inset-y-0 right-0 pr-3 flex items-center">
                        <i class="fa-solid fa-lock text-slate-500"></i>
                    </div>
                    <input type="password" id="password" required minlength="6" class="w-full bg-slate-950 border border-slate-700 rounded-xl px-4 py-3 pr-10 text-sm text-white focus:border-orange-500 focus:outline-none placeholder:text-slate-600" placeholder="كلمة المرور (6 حروف على الأقل)">
                </div>
            </div>
            
            <!-- Confirm Password Field -->
            <div>
                <label class="block text-sm font-bold text-slate-300 mb-2">تأكيد كلمة المرور</label>
                <div class="relative">
                    <div class="absolute inset-y-0 right-0 pr-3 flex items-center">
                        <i class="fa-solid fa-lock text-slate-500"></i>
                    </div>
                    <input type="password" id="confirmPassword" required class="w-full bg-slate-950 border border-slate-700 rounded-xl px-4 py-3 pr-10 text-sm text-white focus:border-orange-500 focus:outline-none placeholder:text-slate-600" placeholder="أعد كتابة كلمة المرور">
                </div>
            </div>
            
            <!-- Error Message -->
            <div id="errorMessage" class="hidden p-3 rounded-lg bg-red-500/20 border border-red-500/30 text-red-400 text-sm"></div>
            
            <!-- Success Message -->
            <div id="successMessage" class="hidden p-3 rounded-lg bg-emerald-500/20 border border-emerald-500/30 text-emerald-400 text-sm"></div>
            
            <!-- Signup Button -->
            <button type="submit" class="w-full py-3.5 rounded-xl bg-orange-500 hover:bg-orange-600 text-white font-bold text-sm transition-all flex items-center justify-center gap-2">
                <i class="fa-solid fa-user-plus"></i>
                <span>إنشاء الحساب</span>
            </button>
        </form>
        
        <!-- Login Link -->
        <div class="mt-6 text-center">
            <p class="text-sm text-slate-400">لديك حساب بالفعل؟</p>
            <a href="/login.html" class="text-orange-500 hover:text-orange-400 font-medium">تسجيل الدخول</a>
        </div>
    </div>
    
    <!-- Application Script -->
    <script>
        // Signup Form Handler
        document.getElementById('signupForm').addEventListener('submit', async function(e) {
            e.preventDefault();
            
            const username = document.getElementById('username').value;
            const email = document.getElementById('email').value;
            const phone = document.getElementById('phone').value;
            const password = document.getElementById('password').value;
            const confirmPassword = document.getElementById('confirmPassword').value;
            const errorMessage = document.getElementById('errorMessage');
            const successMessage = document.getElementById('successMessage');
            
            // Client-side validation
            if (password !== confirmPassword) {
                errorMessage.textContent = 'كلمة المرور غير متطابقة';
                errorMessage.classList.remove('hidden');
                successMessage.classList.add('hidden');
                return;
            }
            
            if (password.length < 6) {
                errorMessage.textContent = 'كلمة المرور يجب أن تكون 6 حروف على الأقل';
                errorMessage.classList.remove('hidden');
                successMessage.classList.add('hidden');
                return;
            }
            
            try {
                const response = await fetch('/api/auth/signup', {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json'
                    },
                    body: JSON.stringify({ username, password, email, phone })
                });
                
                const data = await response.json();
                
                if (response.ok) {
                    // Show success message
                    successMessage.textContent = data.message || 'تم إنشاء الحساب بنجاح! جاري التوجيه...';
                    successMessage.classList.remove('hidden');
                    errorMessage.classList.add('hidden');
                    
                    // Redirect to login after 2 seconds
                    setTimeout(() => {
                        window.location.href = '/login.html';
                    }, 2000);
                } else {
                    // Show error message
                    errorMessage.textContent = data.error || 'فشل في إنشاء الحساب';
                    errorMessage.classList.remove('hidden');
                    successMessage.classList.add('hidden');
                    
                    // Shake animation for error
                    document.getElementById('signupForm').classList.add('animate-shake');
                    setTimeout(() => {
                        document.getElementById('signupForm').classList.remove('animate-shake');
                    }, 500);
                }
            } catch (error) {
                console.error('Signup error:', error);
                errorMessage.textContent = 'حدث خطأ في الخادم';
                errorMessage.classList.remove('hidden');
                successMessage.classList.add('hidden');
            }
        });
        
        // Add shake animation
        const style = document.createElement('style');
        style.textContent = `
            @keyframes shake {
                0%, 100% { transform: translateX(0); }
                25% { transform: translateX(-10px); }
                75% { transform: translateX(10px); }
            }
            .animate-shake {
                animation: shake 0.5s ease-in-out;
            }
        `;
        document.head.appendChild(style);
        
        // Check if already authenticated
        if (localStorage.getItem('authToken')) {
            const role = localStorage.getItem('userRole');
            if (role === 'admin' || role === 'viewer') {
                window.location.href = '/admin.html';
            } else {
                window.location.href = '/customer.html';
            }
        }
    </script>
</body>
</html>

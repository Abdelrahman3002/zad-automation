<!DOCTYPE html>
<html lang="ar" dir="rtl" class="scroll-smooth">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Zad Automation | إعادة تعيين كلمة المرور</title>
    
    <!-- Google Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@300;400;500;600;700;800;900&family=Inter:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
    
    <!-- FontAwesome Icons -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
    
    <!-- Tailwind CSS CDN -->
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    colors: {
                        brand: {
                            navy: '#0a192f',
                            slate: '#1e293b',
                            dark: '#0f172a',
                            orange: '#f97316',
                            gold: '#eab308',
                            cyan: '#06b6d4',
                            accent: '#f97316',
                            card: '#1e293b',
                            border: '#334155'
                        }
                    },
                    fontFamily: {
                        cairo: ['Cairo', 'sans-serif'],
                        inter: ['Inter', 'sans-serif']
                    }
                }
            }
        }
    </script>
    
    <link rel="stylesheet" href="css/style.css">
</head>
<body class="min-h-screen flex items-center justify-center bg-slate-950 p-4">
    
    <!-- Reset Password Container -->
    <div class="glass-card rounded-2xl p-8 border border-slate-700 max-w-md w-full">
        
        <!-- Header showing token info -->
        <div class="text-center mb-8">
            <div class="w-14 h-14 rounded-2xl bg-slate-900 border border-slate-700 mx-auto flex items-center justify-center mb-4">
                <i class="fa-solid fa-lock text-2xl text-orange-500"></i>
            </div>
            <h1 class="text-2xl font-black text-white mb-2">إعادة تعيين كلمة المرور</h1>
            <p class="text-sm text-slate-400">تم التحقق من الرابط، أدخل كلمة المرور الجديدة</p>
            <input type="hidden" id="token" value="">
        </div>
        
        <!-- Reset Password Form -->
        <form id="resetForm" class="space-y-6">
            <!-- Password Field -->
            <div>
                <label class="block text-sm font-bold text-slate-300 mb-2">كلمة المرور الجديدة</label>
                <div class="relative">
                    <div class="absolute inset-y-0 right-0 pr-3 flex items-center">
                        <i class="fa-solid fa-lock text-slate-500"></i>
                    </div>
                    <input type="password" id="newPassword" required minlength="6" class="w-full bg-slate-950 border border-slate-700 rounded-xl px-4 py-3 pr-10 text-sm text-white focus:border-orange-500 focus:outline-none placeholder:text-slate-600" placeholder="كلمة المرور (6 حروف على الأقل)">
                </div>
            </div>
            
            <!-- Confirm Password Field -->
            <div>
                <label class="block text-sm font-bold text-slate-300 mb-2">تأكيد كلمة المرور</label>
                <div class="relative">
                    <div class="absolute inset-y-0 right-0 pr-3 flex items-center">
                        <i class="fa-solid fa-lock text-slate-500"></i>
                    </div>
                    <input type="password" id="confirmNewPassword" required class="w-full bg-slate-950 border border-slate-700 rounded-xl px-4 py-3 pr-10 text-sm text-white focus:border-orange-500 focus:outline-none placeholder:text-slate-600" placeholder="أعد كتابة كلمة المرور">
                </div>
            </div>
            
            <!-- Error/Success Message -->
            <div id="messageBox" class="hidden p-3 rounded-lg text-sm"></div>
            
            <!-- Reset Password Button -->
            <button type="submit" class="w-full py-3.5 rounded-xl bg-gradient-to-r from-emerald-500 to-green-600 hover:from-emerald-600 hover:to-green-700 text-white font-bold text-sm transition-all flex items-center justify-center gap-2">
                <i class="fa-solid fa-key"></i>
                <span>تأكيد إعادة التعيين</span>
            </button>
        </form>
        
        <!-- Info -->
        <div class="mt-6 text-center text-sm text-slate-400">
            إذا لم يظهر الرابط بشكل صحيح، يمكنك <a href="/login.html" class="text-orange-500 hover:text-orange-400 transition-colors">العودة إلى تسجيل الدخول</a>
        </div>
    </div>
    
    <!-- Application Script -->
    <script>
        // Get token from URL query parameter
        const urlParams = new URLSearchParams(window.location.search);
        const storedToken = urlParams.get('token');
        const tokenInput = document.getElementById('token');
        tokenInput.value = storedToken || '';
        
        // Reset Password Form Handler
        document.getElementById('resetForm').addEventListener('submit', async function(e) {
            e.preventDefault();
            
            const newPassword = document.getElementById('newPassword').value;
            const confirmNewPassword = document.getElementById('confirmNewPassword').value;
            const token = tokenInput.value;
            const messageBox = document.getElementById('messageBox');
            
            // Client-side validation
            if (newPassword !== confirmNewPassword) {
                messageBox.textContent = 'كلمتا المرور غير متطابقتين';
                messageBox.className = 'p-3 rounded-lg text-sm bg-red-500/20 border border-red-500/30 text-red-400';
                messageBox.classList.remove('hidden');
                return;
            }
            
            if (newPassword.length < 6) {
                messageBox.textContent = 'يجب أن تكون كلمة المرور 6 حروف على الأقل';
                messageBox.className = 'p-3 rounded-lg text-sm bg-red-500/20 border border-red-500/30 text-red-400';
                messageBox.classList.remove('hidden');
                return;
            }
            
            if (!token) {
                messageBox.textContent = 'رمز التعيين غير صالح';
                messageBox.className = 'p-3 rounded-lg text-sm bg-red-500/20 border border-red-500/30 text-red-400';
                messageBox.classList.remove('hidden');
                return;
            }
            
            try {
                const response = await fetch('/api/auth/reset-password', {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json'
                    },
                    body: JSON.stringify({ token, newPassword })
                });
                
                const data = await response.json();
                
                if (response.ok) {
                    messageBox.textContent = data.message || 'تم إعادة تعيين كلمة المرور بنجاح!';
                    messageBox.className = 'p-3 rounded-lg text-sm bg-emerald-500/20 border border-emerald-500/30 text-emerald-400';
                    messageBox.classList.remove('hidden');
                    
                    // Redirect to login after 2 seconds
                    setTimeout(() => {
                        window.location.href = '/login.html';
                    }, 2000);
                } else {
                    messageBox.textContent = data.error || 'فشل في إعادة تعيين كلمة المرور';
                    messageBox.className = 'p-3 rounded-lg text-sm bg-red-500/20 border border-red-500/30 text-red-400';
                    messageBox.classList.remove('hidden');
                }
            } catch (error) {
                console.error('Reset password error:', error);
                messageBox.textContent = 'حدث خطأ في الخادم';
                messageBox.className = 'p-3 rounded-lg text-sm bg-red-500/20 border border-red-500/30 text-red-400';
                messageBox.classList.remove('hidden');
            }
        });
    </script>
</body>
</html>

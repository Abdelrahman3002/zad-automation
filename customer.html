<!DOCTYPE html>
<html lang="ar" dir="rtl" class="scroll-smooth">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Zad Automation | حسابك</title>
    
    <!-- Google Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@300;400;500;600;700;800;900&family=Inter:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
    
    <!-- FontAwesome Icons -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
    
    <!-- Tailwind CSS CDN -->
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    colors: {
                        brand: {
                            navy: '#0a192f',
                            slate: '#1e293b',
                            dark: '#0f172a',
                            orange: '#f97316',
                            gold: '#eab308',
                            cyan: '#06b6d4',
                            accent: '#f97316',
                            card: '#1e293b',
                            border: '#334155'
                        }
                    },
                    fontFamily: {
                        cairo: ['Cairo', 'sans-serif'],
                        inter: ['Inter', 'sans-serif']
                    }
                }
            }
        }
    </script>
    
    <link rel="stylesheet" href="css/style.css">
</head>
<body class="min-h-screen flex flex-col">

    <!-- Header -->
    <header class="bg-slate-900 border-b border-slate-800 text-xs text-slate-300 py-4 px-4">
        <div class="max-w-7xl mx-auto flex items-center justify-between">
            <div class="flex items-center gap-3">
                <i class="fa-solid fa-user text-orange-500"></i>
                <span class="font-black text-white">مرحباً بك</span>
            </div>
            <div class="flex items-center gap-3">
                <span id="userName" class="text-white font-semibold"></span>
                <button onclick="logout()" class="text-slate-400 hover:text-orange-400 transition-colors">
                    <i class="fa-solid fa-sign-out-alt text-xs"></i>
                    خروج
                </button>
            </div>
        </div>
    </header>

    <!-- Main Content -->
    <main class="flex-1 px-4 sm:px-6 lg:px-8 flex-1">
        <div class="max-w-7xl mx-auto py-8">
            
            <!-- Welcome Section -->
            <div class="glass-card rounded-2xl p-8 border border-slate-700 mb-8 text-center">
                <div class="w-14 h-14 rounded-2xl bg-orange-500/10 text-orange-400 flex items-center justify-center mx-auto mb-6">
                    <i class="fa-solid fa-clock text-orange-400 text-xl"></i>
                </div>
                <h2 class="text-2xl font-black text-white mb-2">حسابك في Zad Automation</h2>
                <p class="text-slate-400">يمكنك عرض طلباتك والمتابعة هنا</p>
            </div>

            <!-- Your Requests -->
            <div class="glass-card rounded-2xl p-8 border border-slate-700">
                <div class="flex items-center justify-between mb-6">
                    <div>
                        <h3 class="text-xl font-black text-white" data-i18n="your-requests">طلباتك</h3>
                        <p class="text-sm text-slate-400" id="requestsCount">0</p>
                    </div>
                    <button onclick="refreshRequests()" class="bg-slate-800 hover:bg-slate-700 border border-slate-700 text-slate-200 font-bold px-4 py-2 rounded-xl transition-colors text-sm">
                        <i class="fa-solid fa-rotate-right"></i>
                        <span data-i18n="btn-refresh">تحديث</span>
                    </button>
                </div>
                
                <div id="noRequests" class="hidden p-6 text-center text-slate-500">
                    <i class="fa-solid fa-inbox text-slate-500 text-2xl mb-3"></i>
                    <p>لا توجد طلبات لحفظها</p>
                </div>
                
                <div id="requestsTable" class="hidden">
                    <table class="w-full text-sm">
                        <thead class="bg-slate-950 border-b border-slate-800">
                            <tr>
                                <th class="text-right px-4 py-3 text-xs font-bold text-slate-400 uppercase tracking-wider" data-i18n="th-id">رقم الطلب</th>
                                <th class="text-right px-4 py-3 text-xs font-bold text-slate-400 uppercase tracking-wider" data-i18n="th-service">الخدمة</th>
                                <th class="text-right px-4 py-3 text-xs font-bold text-slate-400 uppercase tracking-wider" data-i18n="th-company">الشركة</th>
                                <th class="text-right px-4 py-3 text-xs font-bold text-slate-400 uppercase tracking-wider" data-i18n="th-phone">الهاتف</th>
                                <th class="text-right px-4 py-3 text-xs font-bold text-slate-400 uppercase tracking-wider" data-i18n="th-date">التاريخ</th>
                                <th class="text-right px-4 py-3 text-xs font-bold text-slate-400 uppercase tracking-wider" data-i18n="th-status">الحالة</th>
                            </tr>
                        </thead>
                        <tbody id="requestsBody">
                            <!-- rows rendered by JS -->
                        </tbody>
                    </table>
                </div>
            </div>

        </div>
    </main>

    <!-- Application Script -->
    <script>
        let currentUser = null;
        let requests = [];

        // Check authentication on page load
        document.addEventListener('DOMContentLoaded', async () => {
            // Check if user is authenticated
            const token = localStorage.getItem('authToken');
            const role = localStorage.getItem('userRole');
            
            if (!token || role !== 'customer') {
                window.location.href = '/login.html';
                return;
            }
            
            // Get user info
            try {
                const response = await fetch('/api/auth/me', {
                    headers: {
                        'Authorization': `Bearer ${token}`
                    }
                });
                
                if (response.ok) {
                    const data = await response.json();
                    currentUser = data.user;
                    document.getElementById('userName').textContent = currentUser.username;
                    // Fetch customer's own requests
                    await fetchCustomerRequests();
                } else {
                    window.location.href = '/login.html';
                }
            } catch (error) {
                console.error('Error fetching user info:', error);
                window.location.href = '/login.html';
            }
        });

        // Fetch customer's own requests
        async function fetchCustomerRequests() {
            try {
                const response = await fetch('/api/requests/my', {
                    headers: {
                        'Authorization': `Bearer ${token}`
                    }
                });
                
                if (response.ok) {
                    requests = await response.json();
                    renderRequests();
                    document.getElementById('requestsTable').classList.toggle('hidden', requests.length === 0);
                    document.getElementById('noRequests').classList.toggle('hidden', requests.length > 0);
                    
                    // Update count
                    document.getElementById('requestsCount').textContent = requests.length;
                }
            } catch (error) {
                console.error('Error fetching customer requests:', error);
            }
        }

        // Render requests table
        function renderRequests() {
            const tbody = document.getElementById('requestsBody');
            tbody.innerHTML = '';
            
            if (requests.length === 0) {
                document.getElementById('noRequests').classList.remove('hidden');
                document.getElementById('requestsTable').classList.add('hidden');
                return;
            }
            
            document.getElementById('noRequests').classList.add('hidden');
            document.getElementById('requestsTable').classList.remove('hidden');
            
            requests.forEach(r => {
                const tr = document.createElement('tr');
                tr.className = 'border-b border-slate-800 hover:bg-slate-800/50 transition-colors';
                tr.innerHTML = `
                    <td class="px-4 py-3 font-mono text-slate-300 font-bold">${r.id}</td>
                    <td class="px-4 py-3">
                        <span class="text-amber-400 font-bold text-xs">
                            <i class="fa-solid fa-wrench"></i>
                            ${r.service}
                        </span>
                    </td>
                    <td class="px-4 py-3 text-slate-200 font-medium">${r.company}</td>
                    <td class="px-4 py-3">
                        <a href="tel:${r.phone}" class="text-slate-300 hover:text-orange-400 text-xs">${r.phone}</a>
                    </td>
                    <td class="px-4 py-3 text-slate-400 text-xs">${r.submittedAt ? new Date(r.submittedAt).toLocaleDateString('ar-EG') : '-'}</td>
                    <td class="px-4 py-3">
                        <span class="status-${r.status} text-xs px-2.5 py-1 rounded font-bold">${r.status}</span>
                    </td>
                `;
                tbody.appendChild(tr);
            });
        }

        // Logout function
        function logout() {
            localStorage.removeItem('authToken');
            localStorage.removeItem('userRole');
            window.location.href = '/login.html';
        }
    </script>
</body>
</html>
